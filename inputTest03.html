<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="box.css">
    <title>Document</title>
</head>
<body>
    <h1>회원가입</h1>
    <form>
    <table border="1" cellspacing="0" cellpadding="0" width="600" height="500">
 <tr class="intbox">
    <td align="center">아이디</td>
     <td><input type="text" name="memberid"  placeholder="5~12자 사이로 입력하세요" size="50"></td>
 </tr>
 <tr class="intbox">
    <td align="center">비밀번호</td>
    <td> <input type="password" name="password" placeholder="대문자+소문자+숫자로 만든 10자 이상으로 입력하세요" size="50">
    </td>
 </tr>
 <tr class="intbox">
    <td align="center">회원이름</td>
    <td> <input type="text" name="membername" placeholder="이름을 입력하시오." size="50"></td>
 </tr>
<tr class="intbox">
    <td align="center">전화번호</td>
    <td> <input type="text" name="memberPhoneNumber" placeholder="-없이 숫자만 입력" size="50"></td>
 </tr>
<tr class="intbox">
    <td align="center">이메일</td>
    <td> <input type="email" name="memberEmail" placeholder="example@abc.com" size="50"></td>
 </tr>
 <tr class="intbox">
    <td align="center">회원주소</td>
     <td><input type="text" name="memberadress" value="adress" placeholder="주소를 입력하시오." size="50">
    </td>

 <tr class="intbox">
    <td align="center">성별</td>
     <td><input type="radio" name="membergender" value="male" checked>남성
         <input type="radio" name="membergender" value="female">여성
    </td>
 </tr>
 <tr class="intbox">
    <td align="center">회원생일</td>
     <td><input type="date" name="memberbirth"></td>
 </tr>
 <tr class="intbox">
    <td align="center">회원취미</td>
     <td><input type="checkbox" name="memberhobby" value="sports">운동
        <input type="checkbox" name="memberhobby" value="book">독서
        <input type="checkbox" name="memberhobby" value="game">게임
        <input type="checkbox" name="memberhobby" value="movie">영화
    </td>
    <tr class="intbox">
    <td align="center">자기소개</td>
    <td><textarea rows="10" cols="50" placeholder="500자 이내로 작성하시오.">
    </textarea>
    </td>
    </tr>
    <tr>  <td colspan="2">
                    <input type="submit" value="가입완료">
                    <input type="reset" value="초기화">
                </td>
    </tr>
    </table>
    </form>
</body>
</html>
