<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>h2{
        color: aquamarine;

    <link rel="stylesheet" href="color.css">
