<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>테이블 연습</title>
</head>
<body>
    <table border="1" cellspacing="0" width="400"height=400>
        <tr>
            <th><font color="red">월</font></th>
            <th>화</th>
            <th>수</th>
        </tr>
        
        <tr align="center"><!--해당 줄 셀들을 가운데 정렬적용-->
            <td>수학</td>
            <td>영어</td>
            <td>과학</td>
        </tr align="center">
         <tr>
            <td align="center">국어</td>
            <td align="center" bgcolor="yellow" colspan="2">사회</td>
            
        </tr>
         <tr align="center">
            <td rowspan="2">도덕</td>
            <td>음악</td>
            <td>미술</td>
        </tr>
         <tr align="center">
            <td>영어</td>
            <td>수학</td>
            
        </tr>
           
    </table>
    
</body>
</html>
